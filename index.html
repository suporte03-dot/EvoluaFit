<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="icon" type="image/png" href="%BASE_URL%icons/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="EvoluaFit — Evolua além do treino. Organize sua rotina, acompanhe sua evolução e saiba exatamente qual é o próximo passo."
    />
    <meta name="theme-color" content="#040814" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="EvoluaFit" />
    <title>EvoluaFit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        background: #070a0f;
        color: #e8eef8;
      }
      .ef-boot {
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Figtree, system-ui, sans-serif;
        font-size: 0.95rem;
        letter-spacing: 0.02em;
        color: #c5cde0;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <p class="ef-boot">Abrindo o EvoluaFit…</p>
    </div>
    <script>
      (function () {
        var KEY = 'evoluafit-sw-bust'
        var MAX_ATTEMPTS = 2

        function showRecovery() {
          var boot = document.querySelector('.ef-boot')
          if (!boot) return
          boot.innerHTML =
            '<span>Não foi possível abrir o EvoluaFit.</span>' +
            '<button type="button" style="margin-top:16px;padding:10px 18px;border:0;border-radius:8px;background:#7657ff;color:#fff;font:inherit;cursor:pointer">Tentar novamente</button>'
          boot.style.textAlign = 'center'
          boot.style.alignContent = 'center'
          boot.querySelector('button').addEventListener('click', function () {
            try {
              sessionStorage.removeItem(KEY)
            } catch (err) {
              /* segue com o reload */
            }
            location.reload()
          })
        }

        function bust() {
          var attempts = 0
          try {
            attempts = Number(sessionStorage.getItem(KEY) || 0)
            if (attempts >= MAX_ATTEMPTS) {
              showRecovery()
              return
            }
            sessionStorage.setItem(KEY, String(attempts + 1))
          } catch (err) {
            /* tenta recuperar mesmo sem sessionStorage */
          }
          if (!('serviceWorker' in navigator)) {
            location.reload()
            return
          }
          navigator.serviceWorker
            .getRegistrations()
            .then(function (regs) {
              return Promise.all(regs.map(function (reg) { return reg.unregister() }))
            })
            .then(function () {
              if (!('caches' in window)) return
              return caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (key) { return caches.delete(key) }))
              })
            })
            .then(function () {
              location.reload()
            })
            .catch(function () {
              location.reload()
            })
        }
        window.addEventListener(
          'error',
          function (event) {
            var src = String((event.filename || (event.target && event.target.src) || ''))
            if (src.indexOf('/assets/') !== -1) bust()
          },
          true,
        )
        window.addEventListener('unhandledrejection', function (event) {
          var msg = String((event.reason && event.reason.message) || event.reason || '')
          if (/Failed to fetch dynamically imported module|Loading chunk|error loading dynamically imported/i.test(msg)) {
            bust()
          }
        })
        window.setTimeout(function () {
          if (document.querySelector('.ef-boot')) {
            bust()
            return
          }
          try {
            sessionStorage.removeItem(KEY)
          } catch (err) {
            /* app já iniciou */
          }
        }, 7000)
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
